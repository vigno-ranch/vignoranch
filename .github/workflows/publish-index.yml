name: Publish index.html from release asset

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download temp-index-upload --pattern 'vigno-ranch.html' --dir /tmp
          cp /tmp/vigno-ranch.html index.html
      - name: Commit updated index.html
        run: |
          git config user.name "vigno-ranch"
          git config user.email "VignoRanch@gmail.com"
          git add index.html
          git commit -m "Update index.html" || exit 0
          git push
