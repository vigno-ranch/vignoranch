name: Publish index.html from release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.0.0 --pattern 'vigno-ranch.html' --dir /tmp/site
          cp /tmp/site/vigno-ranch.html index.html
          ls -lh index.html
      - name: Commit index.html
        run: |
          git config user.name "vigno-ranch"
          git config user.email "VignoRanch@gmail.com"
          git add index.html
          git commit -m "Add index.html from release v1.0.0" || echo "nothing to commit"
          git push
